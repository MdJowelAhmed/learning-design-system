name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-quality-checks:
    name: Type-check, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript Verification
        run: pnpm type-check

      - name: ESLint Code Quality
        run: pnpm lint

      - name: Vitest Unit Testing
        run: pnpm test

      - name: Compile Design System Package (CJS/ESM/Types/CSS)
        run: pnpm build

      - name: Build Storybook Documentation Site
        run: pnpm run build-storybook
